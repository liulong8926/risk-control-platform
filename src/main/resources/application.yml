server:
  port: ${ENTERPRISE_RISK_PORT:8092}
spring:
  application.name: enterprise-risk
  datasource:
    url: ${ENTERPRISE_RISK_DB_URL:jdbc:h2:file:./data/enterprise-risk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${ENTERPRISE_RISK_DB_USERNAME:sa}
    password: ${ENTERPRISE_RISK_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health,info
enterprise-risk:
  jwt-secret: ${ENTERPRISE_RISK_JWT_SECRET:change-me-in-production-enterprise-risk-secret-32}
  key-encryption-secret: ${ENTERPRISE_RISK_KEY_ENCRYPTION_SECRET:change-me-in-production-key-secret-32}
  tianyancha:
    endpoint: ${ENTERPRISE_RISK_TIANYANCHA_ENDPOINT:https://mcp.tianyancha.com/mcp}
    timeout-seconds: ${ENTERPRISE_RISK_TIANYANCHA_TIMEOUT_SECONDS:30}
