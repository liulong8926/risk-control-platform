plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.5'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tehang.enterpriserisk'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'org.apache.poi:poi-ooxml:5.3.0'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
  useJUnitPlatform()
  // Keep automated tests isolated from the developer's persistent local H2 database.
  systemProperty 'spring.datasource.url', 'jdbc:h2:mem:enterprise-risk-test;MODE=MySQL;DB_CLOSE_DELAY=-1'
  systemProperty 'spring.datasource.username', 'sa'
  systemProperty 'spring.datasource.password', ''
  systemProperty 'enterprise-risk.jwt-secret', 'test-jwt-secret-012345678901234567890123'
  systemProperty 'enterprise-risk.key-encryption-secret', 'test-key-secret-012345678901234567890123'
  systemProperty 'enterprise-risk.bootstrap-admin-password', 'test-bootstrap-admin-password'
  systemProperty 'enterprise-risk.tianyancha.endpoint', 'http://localhost:1'
  systemProperty 'enterprise-risk.tianyancha.timeout-seconds', '1'
}
